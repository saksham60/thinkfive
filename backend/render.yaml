services:
  - type: web
    name: thinkfive-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: starter
    numInstances: 1
    envVars:
      - key: PORT
        value: 8000
      - key: WORKERS
        value: 1
      - key: LLM_PROVIDER
        value: gemini
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-2
      - key: EMBEDDING_DIMENSIONS
        value: 1536
      - key: GEMINI_API_KEY
        sync: false
      - key: COOKIE_SECURE
        value: true
      - key: COOKIE_SAMESITE
        value: none
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,http://localhost:3000,https://thinkfive.vercel.app
      - key: CORS_ALLOWED_ORIGIN_REGEX
        value: https://thinkfive(?:-[a-z0-9-]+)?\.vercel\.app
      # Required direct PostgreSQL DSN. Render prompts for this secret when the
      # Blueprint is created; it cannot be derived from Supabase API keys.
      - key: DATABASE_URL
        sync: false
      - fromGroup: thinkfive-env

    healthCheckPath: /health
