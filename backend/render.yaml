services:
  - type: web
    name: thinkfive-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: starter
    numInstances: 1
    envVars:
      - key: PORT
        value: 8000
      - key: WORKERS
        value: 1
      - fromGroup: thinkfive-env

    healthCheckPath: /health
